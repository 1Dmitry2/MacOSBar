# Public :443 on this VPS is muxed in stream (see scripts/patch-vps-stream-sni.sh).
# TLS for mactools terminates on loopback :8445 after SNI routing.
server {
    listen 80;
    listen [::]:80;
    server_name mactools.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/mactools;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8445 ssl;
    http2 on;
    server_name mactools.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/mactools.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mactools.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mactools;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /downloads/ {
        default_type application/octet-stream;
    }

    gzip on;
    gzip_types text/css application/javascript text/html application/xml image/svg+xml;
}

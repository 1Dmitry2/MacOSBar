# Public 443 on this host may be used by other services — serve site on :80.
server {
    listen 80;
    listen [::]:80;
    server_name mactools.duckdns.org;

    root /var/www/mactools;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /downloads/ {
        default_type application/octet-stream;
    }

    gzip on;
    gzip_types text/css application/javascript text/html application/xml image/svg+xml;
}

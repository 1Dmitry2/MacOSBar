# mactools.duckdns.org — HTTP + HTTPS (SNI alongside other vhosts on :443).
server {
    listen 80;
    listen [::]:80;
    server_name mactools.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mactools.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/mactools.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mactools.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mactools;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /downloads/ {
        default_type application/octet-stream;
    }

    gzip on;
    gzip_types text/css application/javascript text/html application/xml image/svg+xml;
}
